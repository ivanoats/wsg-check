name: Publish to npm

on:
  release:
    types: [published]
  # Allows manual dispatch from the Actions tab after release-please
  # merges a release PR — GITHUB_TOKEN-created releases don't trigger
  # other workflows, so this is how we publish them.
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 ships with npm 11.x, required for Trusted Publishing (OIDC)
          # token exchange with the npm registry (added in npm 11.5.1).
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup npm for Trusted Publishing
        run: |
          npm install --global --ignore-scripts npm@11.19.0
          npm --version
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish to npm
        run: npm publish --provenance --access public

  # Lists the release in the MCP Registry (server.json). The registry checks
  # that the npm package's mcpName matches server.json's name, so this runs
  # after the npm publish. GitHub OIDC proves ownership of io.github.ivanoats.
  mcp-registry:
    name: Publish to the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: '1.8.1'
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher

      - name: Check server.json matches package.json
        run: |
          version=$(jq -r .version package.json)
          jq -e --arg v "$version" '.version == $v and .packages[0].version == $v' server.json \
            || { echo "::error::server.json versions must equal package.json ($version)"; exit 1; }

      - name: Authenticate to the MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      # The registry reads the new version from npm, which can take a minute
      # to appear after npm publish, so retry a few times.
      - name: Publish server.json
        run: |
          for attempt in 1 2 3 4 5; do
            "$RUNNER_TEMP/mcp-publisher" publish && exit 0
            echo "Attempt $attempt failed; retrying in 30 seconds"
            sleep 30
          done
          exit 1
